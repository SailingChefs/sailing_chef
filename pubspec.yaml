name: sailing_chefs
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  google_maps_flutter: ^2.6.0
  uuid: ^4.4.0
  flutter_easyloading: ^3.0.5
  flutter_remix: ^0.0.3
  flutter_screenutil: ^5.9.0
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.1.0
  firebase_core: ^2.25.4
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.6
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  flutter_launcher_icons: ^0.13.1
  syncfusion_flutter_sliders: ^24.2.9
  syncfusion_flutter_core: ^24.2.9
  dotted_border: ^2.1.0
  firebase_storage: ^11.6.11
  audioplayers: ^6.0.0
  audio_waveforms: ^1.0.5
  
  geolocator: ^11.0.0
  geocoding_android:
  flutter_rating_bar: ^4.0.1
  photo_view: ^0.15.0
  geocoding: ^3.0.0
  path_provider: ^2.1.2
  record: ^5.0.5
  just_audio: ^0.9.37
  permission_handler: ^11.3.1
  font_awesome_flutter: ^10.7.0
  lottie: ^3.1.0
  # intl: ^0.19.0
  device_preview: ^1.1.0
  dart_geohash: ^2.1.0
  geoflutterfire_plus: ^0.0.21
  
 
  

  intl: any
  stacked_shared: any

  media_cache_manager: ^0.2.2
  just_audio_cache: ^0.1.2

  video_player: ^2.8.6
  video_thumbnail: ^0.5.3

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/
    - assets/images/background/
    - assets/images/icons/
    - assets/images/logo/
    - assets/images/misc/
fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
        - asset: assets/fonts/Inter-Medium.ttf
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/CaviarDreams.ttf
        - asset: assets/fonts/CaviarDreams_Bold.ttf
        - asset: assets/fonts/CaviarDreams_BoldItalic.ttf
        - asset: assets/fonts/CaviarDreams_Italic.ttf

